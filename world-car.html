<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>World Car – Fahr in die Zukunft</title>
<style>
  :root{
    --ink:#22303C; --paper:#FFFFFF; --sun:#F7C948; --leaf:#3FA66A;
    --sky:#BDE3F0; --smog:#8B8578; --danger:#D9534F;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-touch-callout:none;}
  html,body{height:100%; overflow:hidden; font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif; color:var(--ink); touch-action:manipulation;}
  #c{position:fixed; inset:0; width:100%; height:100%; display:block; background:var(--sky);}

  /* ---------- HUD ---------- */
  #hud{position:fixed; top:0; left:0; right:0; padding:10px 14px; display:none; gap:10px;
       flex-wrap:wrap; align-items:center; pointer-events:none;}
  .bar{flex:1 1 160px; min-width:140px; background:rgba(255,255,255,.82); border-radius:14px;
       padding:6px 10px; box-shadow:0 2px 8px rgba(34,48,60,.15);}
  .bar label{font-size:.68rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; display:flex; justify-content:space-between;}
  .track{height:10px; border-radius:6px; background:#E4E9ED; margin-top:4px; overflow:hidden;}
  .fill{height:100%; border-radius:6px; transition:width .12s linear;}
  #fDist .fill{background:var(--leaf);}
  #fEnergy .fill{background:var(--sun);}
  #fUmwelt .fill{background:linear-gradient(90deg,#C4A15A,#A0522D,#7B3F2A);}
  #hint{position:fixed; top:74px; left:50%; transform:translateX(-50%); background:rgba(34,48,60,.85);
        color:#fff; font-weight:700; font-size:.85rem; padding:7px 16px; border-radius:20px; display:none; max-width:90%; text-align:center;}

  /* ---------- Touch ---------- */
  #touch{position:fixed; bottom:16px; left:0; right:0; display:none; justify-content:space-between; padding:0 18px; pointer-events:none;}
  .tbtn{pointer-events:auto; width:86px; height:86px; border-radius:50%; border:none; font-size:2rem; font-weight:900;
        background:rgba(255,255,255,.9); color:var(--ink); box-shadow:0 4px 12px rgba(34,48,60,.3);
        touch-action:none; user-select:none; -webkit-user-select:none;}
  .tbtn:active{transform:scale(.94); background:#fff;}
  #btnTurbo{width:auto; height:60px; border-radius:30px; padding:0 22px; font-size:1rem; background:var(--sun); display:none;}

  /* ---------- Overlay-Screens ---------- */
  #overlay{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px;
           background:linear-gradient(180deg,#BDE3F0 0%,#DFF2E4 70%,#B9E3B4 100%); overflow-y:auto;}
  #overlay.trans{background:rgba(20,30,38,.55); backdrop-filter:blur(2px);}
  .panel{background:var(--paper); border-radius:24px; padding:26px 26px 22px; max-width:760px; width:100%;
         margin:auto; box-shadow:0 14px 40px rgba(34,48,60,.25); text-align:center;}
  h1{font-size:clamp(2rem,6vw,3.2rem); font-weight:900; letter-spacing:-.02em; line-height:1.05;}
  h1 span{color:var(--leaf);}
  h2{font-size:1.4rem; font-weight:900; margin-bottom:6px;}
  .eyebrow{display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
           background:var(--ink); color:#fff; border-radius:12px; padding:4px 12px; margin-bottom:12px;}
  p.lead{margin:12px auto 4px; max-width:52ch; line-height:1.5;}
  .btn{display:inline-block; border:none; cursor:pointer; font-family:inherit; font-weight:800; font-size:1.05rem;
       padding:13px 30px; border-radius:16px; margin:8px 6px 0; color:#fff; background:var(--leaf);
       box-shadow:0 4px 0 rgba(34,48,60,.25); transition:transform .08s;}
  .btn:hover{transform:translateY(-2px);}
  .btn:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .btn.alt{background:var(--ink);}
  .btn.warn{background:var(--danger);}
  .btn.sun{background:var(--sun); color:var(--ink);}

  /* Level-Auswahl: die Zeitstraße */
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-top:18px; text-align:left;}
  .card{border-radius:18px; padding:14px; color:#fff; position:relative; min-height:132px; cursor:pointer;
        border:none; font-family:inherit; text-align:left; transition:transform .1s; display:flex; flex-direction:column; justify-content:space-between;}
  .card:hover:not(.locked){transform:translateY(-3px);}
  .card:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .card .year{font-size:1.5rem; font-weight:900;}
  .card .place{font-weight:700; font-size:.95rem; opacity:.95;}
  .card .drive{font-size:.75rem; font-weight:700; background:rgba(255,255,255,.25); border-radius:10px; padding:3px 9px; align-self:flex-start; margin-top:6px;}
  .card .stars{position:absolute; top:12px; right:12px; font-size:.95rem; letter-spacing:.05em;}
  .card.locked{filter:grayscale(.85); opacity:.55; cursor:not-allowed;}
  .card.locked::after{content:"🔒"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2rem;}

  .starsBig{font-size:2.6rem; letter-spacing:.1em; margin:10px 0 4px;}
  .infoBox{background:#F2F7F3; border-radius:16px; padding:16px 18px; margin:14px 0 4px; text-align:left; line-height:1.55;}
  .infoBox b{color:var(--leaf);}
  .keys{font-size:.8rem; opacity:.75; margin-top:12px;}
  kbd{background:#EDF1F4; border-radius:6px; padding:2px 8px; font-family:inherit; font-weight:700; border:1px solid #D5DDE2;}

  @media (prefers-reduced-motion: reduce){ .btn, .card{transition:none;} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="bar" id="fDist"><label>🛣️ Strecke <span id="tDist">0 km</span></label><div class="track"><div class="fill" style="width:0%"></div></div></div>
  <div class="bar" id="fEnergy"><label><span id="lEnergy">⚡ Energie</span> <span id="tEnergy">100 %</span></label><div class="track"><div class="fill" style="width:100%"></div></div></div>
  <div class="bar" id="fUmwelt"><label>🌍 Umwelt <span id="tUmwelt">0 %</span></label><div class="track"><div class="fill" style="width:0%"></div></div></div>
</div>
<div id="hint"></div>

<div id="touch">
  <button class="tbtn" id="btnBrake" aria-label="Bremsen">⏪</button>
  <button class="tbtn" id="btnTurbo">TURBO 🔥</button>
  <button class="tbtn" id="btnGas" aria-label="Gas geben">⏩</button>
</div>

<div id="overlay"></div>

<script>
"use strict";
/* =========================================================
   WORLD CAR – Fahr in die Zukunft
   Ein Lernspiel über Autos & Nachhaltigkeit (1908–2070)
   ========================================================= */

const cv = document.getElementById("c");
const cx = cv.getContext("2d");
let W = 0, H = 0, GROUND = 0;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; GROUND = H * 0.74; }
addEventListener("resize", resize); resize();

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Leveldaten ---------- */
const LEVELS = [
{ // 1
  jahr:"1908", ort:"Berlin", antrieb:"Benzin", energyLabel:"⛽ Benzin",
  dist:3, pxKm:2400, vmax:165, drain:2.0, idle:0.12, pollute:2.0,
  obstacles:[{km:0.9},{km:1.7},{km:2.4}],
  stars:[65,85],
  pal:{sky1:"#F0E3C0",sky2:"#D9C79A",ground:"#8A7550",road:"#6B5B45",far:"#8C7A57",mid:"#5C4B33"},
  cardCol:"#8A6F3F", carType:"oldtimer",
  info:"Berlin, 1908. Die ersten Autos fahren mit <b>Benzin</b>. Sie sind langsam, laut – und aus dem Auspuff kommt eine Menge Dreck. Achtung: Auf der Straße sind noch Pferdekutschen unterwegs!",
  tipp:"Nimm den Fuß vom Gas und lass das Auto rollen. Nur beim Gasgeben entstehen Abgase!"
},
{ // 2
  jahr:"1985", ort:"Ruhrgebiet", antrieb:"Diesel", energyLabel:"⛽ Diesel",
  dist:15, pxKm:700, vmax:300, drain:1.8, idle:0.1, pollute:2.4,
  slowZones:[[4,5.5],[9,10.5]],
  stars:[55,80],
  pal:{sky1:"#C8C4BC",sky2:"#A8A49C",ground:"#7B7F72",road:"#55565C",far:"#6E7076",mid:"#4A4B52"},
  cardCol:"#5A5B63", carType:"diesel",
  info:"Ruhrgebiet, 1985. <b>Diesel</b>-Motoren sind stark und schnell, aber sie stoßen viel Ruß aus. Die Luft in den Städten wird immer schlechter. Unterwegs bremsen dich Baustellen aus.",
  tipp:"In Baustellen bringt Vollgas nichts – geh vom Gas und spare Abgase."
},
{ // 3
  jahr:"2026", ort:"Deutschland", antrieb:"Elektro", energyLabel:"🔋 Akku",
  dist:40, pxKm:340, vmax:330, drain:5.0, idle:0.1, pollute:0,
  stations:[14,27], chargeRate:30, stationWin:0.7,
  stars:[10,50],
  pal:{sky1:"#BFE3F5",sky2:"#8FCBEA",ground:"#86BB6B",road:"#5A6069",far:"#9FB9CC",mid:"#6F93AD"},
  cardCol:"#3E8FBF", carType:"ev",
  info:"Deutschland, 2026. <b>Elektroautos</b> fahren fast ohne Abgase. Aber der Akku ist schnell leer – und Ladesäulen sind noch selten. Plane deine Stopps gut!",
  tipp:"Halte an den Ladesäulen an (bremsen!) und warte, bis der Akku wieder voll ist."
},
{ // 4
  jahr:"2040", ort:"Küstenstraße", antrieb:"Solar", energyLabel:"☀️ Solar-Akku",
  dist:80, pxKm:180, vmax:340, drain:9, idle:0.1, pollute:0, regen:7, startEnergy:70,
  shadows:[[18,26],[44,54],[62,68]],
  stars:[10,50],
  pal:{sky1:"#FFE9A8",sky2:"#8ED4E4",ground:"#DFC287",road:"#3E4C66",far:"#2E9FB8",mid:"#48B7CE"},
  cardCol:"#E8A93C", carType:"solar",
  info:"Küstenstraße, 2040. Dieses Auto lädt sich mit <b>Sonnenlicht</b> selbst auf! In Tunneln und Schattenzonen bekommt es aber keine neue Energie.",
  tipp:"Tanke in der Sonne Energie auf Vorrat, bevor ein Tunnel kommt."
},
{ // 5
  jahr:"2055", ort:"Grüne Megacity", antrieb:"Wasserstoff / Druckluft", energyLabel:"🫧 Tank",
  dist:120, pxKm:120, vmax:360, idle:0.1, pollute:0,
  choice:true, stationWin:1.5,
  variants:{
    h2:  {label:"💧 Wasserstoff", drain:4.5, stations:[55,95],           chargeRate:40, energyLabel:"💧 Wasserstoff"},
    air: {label:"💨 Druckluft",   drain:10,  stations:[20,40,60,80,100], chargeRate:60, energyLabel:"💨 Druckluft"}
  },
  stars:[10,50],
  pal:{sky1:"#DFF2E4",sky2:"#A9DCC3",ground:"#7CBF7E",road:"#4E5A63",far:"#5FA98C",mid:"#3E8A6E"},
  cardCol:"#3FA66A", carType:"pod",
  info:"Megacity, 2055. Wähle deinen Antrieb: <b>Wasserstoff</b> hat eine riesige Reichweite, aber nur wenige Tankstellen. <b>Druckluft</b> ist blitzschnell nachgefüllt, reicht aber nicht weit.",
  tipp:"Beide Antriebe sind sauber – aber sie fahren sich ganz unterschiedlich. Probiere beide aus!"
},
{ // 6
  jahr:"2070", ort:"Weltumrundung", antrieb:"Solar + Elektro", energyLabel:"☀️ Solar-Akku",
  dist:200, pxKm:90, vmax:340, drain:6, idle:0.1, pollute:0, regen:6, startEnergy:90,
  shadows:[[40,55],[110,125],[160,170]],
  turbo:{speed:150, pollute:9},
  stars:[12,30],
  pal:{sky1:"#CFE6FA",sky2:"#A7D6C9",ground:"#8CC98A",road:"#46525C",far:"#8FB4D9",mid:"#5E9E82"},
  cardCol:"#7B5FD9", carType:"future",
  info:"Weltumrundung, 2070. Dein <b>Solar-Elektro-Auto</b> fährt komplett sauber. Nur der Notfall-Turbo verbrennt Treibstoff und verschmutzt die Luft. <b>Netto-Null-Challenge:</b> Komm an, ohne die Umwelt-Leiste zu füllen!",
  tipp:"Turbo mit <b>Shift</b> (oder Turbo-Button) – aber sparsam! Jede Sekunde Turbo macht die Luft schmutziger."
}];

/* ---------- Fortschritt (nur im Speicher, kein Login) ---------- */
const progress = { unlocked:1, stars:[0,0,0,0,0,0] };

/* ---------- Spielzustand ---------- */
let screen = "menu";        // menu | select | info | play | result | fail
let game = null;
let currentIdx = 0;
let chosenVariant = null;

const keys = {};
addEventListener("keydown", e => { keys[e.key] = true; if(["ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault(); });
addEventListener("keyup",   e => { keys[e.key] = false; });

/* Touch-Buttons */
const touchWrap = document.getElementById("touch");
const isTouch = matchMedia("(pointer: coarse)").matches;
let tGas=false, tBrake=false, tTurbo=false;
function bindHold(id, set){
  const el = document.getElementById(id);
  const on  = e => { e.preventDefault(); set(true); };
  const off = e => { e.preventDefault(); set(false); };
  el.addEventListener("pointerdown", on);
  el.addEventListener("pointerup", off);
  el.addEventListener("pointerleave", off);
  el.addEventListener("pointercancel", off);
}
bindHold("btnGas",   v=>tGas=v);
bindHold("btnBrake", v=>tBrake=v);
bindHold("btnTurbo", v=>tTurbo=v);

/* ---------- Hilfen ---------- */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
function hexToRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function mixCol(h1,h2,t){ const a=hexToRgb(h1),b=hexToRgb(h2);
  return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`; }
function fmtKm(v){ return (v>=10? Math.round(v) : Math.round(v*10)/10) + " km"; }

/* Hügelprofil (Welt-Koordinaten) */
function gy(wx){ return GROUND + 16*Math.sin(wx*0.003) + 9*Math.sin(wx*0.0011+2); }
function slopeAt(wx){ return (gy(wx+8)-gy(wx-8))/16; }

/* ---------- Level starten ---------- */
function startLevel(idx, variantKey){
  const base = LEVELS[idx];
  const L = Object.assign({}, base);
  if(base.choice && variantKey){
    Object.assign(L, base.variants[variantKey]);
    chosenVariant = variantKey;
  }
  currentIdx = idx;
  game = {
    L, worldX:0, speed:0,
    energy: L.startEnergy ?? 100,
    pollution:0, time:0,
    particles:[], smoke:[],
    obstacleOff:(base.obstacles||[]).map(()=>0),
    hintTimer:0, hintText:"",
    finished:false
  };
  document.getElementById("lEnergy").textContent = L.energyLabel;
  document.getElementById("hud").style.display = "flex";
  touchWrap.style.display = isTouch ? "flex" : "none";
  document.getElementById("btnTurbo").style.display = (isTouch && L.turbo) ? "block" : "none";
  hideOverlay();
  screen = "play";
}

/* ---------- Update ---------- */
function inZone(zones, km){ return (zones||[]).some(z => km>=z[0] && km<=z[1]); }

function update(dt){
  const g = game, L = g.L;
  g.time += dt;
  const carX = W*0.24;
  const carWX = g.worldX + carX;
  const km = g.worldX / L.pxKm;

  let th = (keys["ArrowRight"]||keys["d"]||keys["D"]||tGas) ? 1 : 0;
  let br = (keys["ArrowLeft"]||keys["a"]||keys["A"]||tBrake) ? 1 : 0;
  let turbo = L.turbo && (keys["Shift"]||tTurbo);
  if(g.energy<=0){ th = 0; turbo = false; }

  /* Physik */
  const slope = slopeAt(carWX);
  let vmax = L.vmax + (turbo? L.turbo.speed:0);
  if(inZone(L.slowZones, km)) vmax = Math.min(vmax, 120);
  const drag = 0.5;                       /* niedrig, damit "Rollen lassen" funktioniert */
  const accel = L.vmax*0.62;
  g.speed += (accel*th - 480*br - g.speed*drag + slope*420 + (turbo? 260:0))*dt;
  g.speed = clamp(g.speed, 0, vmax);

  /* Kutschen (Level 1): langsame Hindernisse */
  if(L.obstacles){
    L.obstacles.forEach((o,i)=>{
      g.obstacleOff[i] += 26*dt;
      const owx = o.km*L.pxKm + g.obstacleOff[i];
      const gap = owx - carWX;              /* >0: Kutsche ist vor uns */
      if(gap > -16 && gap < 50 && g.speed > 60){
        g.speed = 60;
        showHint("🐴 Vorsicht, Kutsche! Überhole langsam.");
      }
    });
  }

  g.worldX += g.speed*dt;

  /* Energie */
  let drain = L.idle + L.drain*th;
  g.energy -= drain*dt;
  const sunny = L.regen && !inZone(L.shadows, km);
  if(sunny) g.energy += L.regen*dt;
  /* Laden an Stationen */
  if(L.stations){
    const win = L.stationWin || 0.7;
    const near = L.stations.find(s => Math.abs(s-km) < win);
    if(near !== undefined && g.speed < 45){
      g.energy += L.chargeRate*dt;
      showHint("🔌 Lädt … warte, bis der Tank voll ist!");
    }
    const next = L.stations.find(s => s > km);
    if(next !== undefined && g.hintTimer<=0 && (next-km) < L.dist*0.35)
      showHint(`Nächste Station: ${fmtKm(next-km)}`, 1.2);
  }
  g.energy = clamp(g.energy, 0, 100);
  if(g.energy<=0 && g.speed<6){ fail("energie"); return; }

  /* Umwelt */
  let pol = L.pollute*th;
  if(turbo) pol += L.turbo.pollute;
  g.pollution += pol*dt;
  if(g.pollution>=100){ fail("umwelt"); return; }

  /* Abgas-Partikel */
  if(pol > 0.4 && g.speed > 5){
    const n = reduceMotion? 1 : Math.ceil(pol);
    for(let i=0;i<n;i++){
      g.smoke.push({wx:carWX-46, y:gy(carWX)-26+Math.random()*8,
        vx:-30-Math.random()*40, vy:-18-Math.random()*22,
        r:4+Math.random()*5, life:1.4, max:1.4});
    }
  }
  g.smoke = g.smoke.filter(p=>{ p.life-=dt; p.wx+=p.vx*dt*0.4; p.y+=p.vy*dt; p.r+=6*dt; return p.life>0; });

  /* Schatten-Warnung */
  if(L.shadows && !sunny && L.regen) showHint("🌑 Schattenzone – keine Solar-Energie!", 0.4);

  g.hintTimer -= dt;
  if(g.hintTimer<=0) document.getElementById("hint").style.display="none";

  /* Ziel */
  if(km >= L.dist && !g.finished){ g.finished = true; finish(); }

  updateHUD(km);
}

function showHint(text, t=1.5){
  const el = document.getElementById("hint");
  el.textContent = text; el.style.display="block";
  game.hintTimer = t;
}

function updateHUD(km){
  const L = game.L;
  const set = (id, frac, txt)=>{
    const el = document.getElementById(id);
    el.querySelector(".fill").style.width = clamp(frac,0,1)*100+"%";
    el.querySelector("label span:last-child").textContent = txt;
  };
  set("fDist",   km/L.dist,        `${fmtKm(Math.min(km,L.dist))} / ${L.dist} km`);
  set("fEnergy", game.energy/100,  Math.round(game.energy)+" %");
  set("fUmwelt", game.pollution/100, Math.round(game.pollution)+" %");
}

/* ---------- Zeichnen ---------- */
function draw(){
  const g = game, L = g.L;
  const polFrac = g.pollution/100;
  const km = g.worldX/L.pxKm;
  const inShadow = L.shadows && inZone(L.shadows, km);

  /* Himmel: wird mit Verschmutzung grauer */
  const sky1 = mixCol(L.pal.sky1, "#9A8F7D", polFrac*0.65);
  const sky2 = mixCol(L.pal.sky2, "#7E766A", polFrac*0.65);
  const grad = cx.createLinearGradient(0,0,0,GROUND);
  grad.addColorStop(0, sky1); grad.addColorStop(1, sky2);
  cx.fillStyle = grad; cx.fillRect(0,0,W,H);

  /* Sonne */
  cx.beginPath(); cx.arc(W*0.8, H*0.18, 34, 0, 7);
  cx.fillStyle = mixCol("#FFD75E", "#B8A98C", polFrac*0.7); cx.fill();

  drawFarLayer(L);
  drawMidLayer(L);
  drawGroundAndRoad(L);
  drawZones(L, km);
  drawStations(L);
  drawObstacles(L);
  drawCar(L);
  drawSmoke();

  if(inShadow){ cx.fillStyle="rgba(20,25,40,.28)"; cx.fillRect(0,0,W,H); }
}

/* ferne Silhouetten (Parallaxe 0.25) */
function drawFarLayer(L){
  const off = game.worldX*0.25, step = 230;
  cx.fillStyle = L.pal.far; cx.globalAlpha = .5;
  if(L.carType==="solar"){ /* Meer statt Häusern */
    cx.fillRect(0, GROUND-70, W, 70);
    cx.globalAlpha = .8; cx.strokeStyle="#FFFFFF"; cx.lineWidth=2;
    for(let x=-(off%90); x<W; x+=90){
      cx.beginPath(); cx.arc(x, GROUND-40+10*Math.sin(x*0.05+game.time), 12, 3.4, 6.0); cx.stroke();
    }
  } else {
    for(let x=-(off%step)-step; x<W+step; x+=step){
      const seed = Math.abs(Math.sin((x+off)*0.013));
      const h = 60+seed*90;
      cx.fillRect(x, GROUND-58-h, 90+seed*60, h+58);
    }
  }
  cx.globalAlpha = 1;
}

/* mittlere Ebene mit epochen-typischen Requisiten (Parallaxe 0.5) */
function drawMidLayer(L){
  const off = game.worldX*0.5, step = 320;
  for(let x=-(off%step)-step; x<W+step; x+=step){
    const seed = Math.abs(Math.sin((x+off)*0.021));
    midProp(L, x+seed*40, seed);
  }
}
function midProp(L, x, seed){
  const t = game.time;
  cx.save();
  switch(L.carType){
    case "oldtimer": { /* Altbau mit Giebeldach */
      const h = 70+seed*60;
      cx.fillStyle = L.pal.mid;
      cx.fillRect(x, GROUND-30-h, 84, h+30);
      cx.beginPath(); cx.moveTo(x-6, GROUND-30-h); cx.lineTo(x+42, GROUND-58-h); cx.lineTo(x+90, GROUND-30-h); cx.closePath(); cx.fill();
      cx.fillStyle = "rgba(255,240,200,.7)";
      for(let r=0;r<3;r++) for(let c=0;c<2;c++) cx.fillRect(x+18+c*34, GROUND-52-h+r*26, 12, 14);
      break; }
    case "diesel": { /* Schornstein mit Rauch */
      cx.fillStyle = L.pal.mid;
      cx.fillRect(x, GROUND-30-140*(.6+seed*.5), 30, 140*(.6+seed*.5)+30);
      cx.fillStyle = "rgba(120,115,110,.5)";
      for(let i=0;i<3;i++){
        const yy = GROUND-170*(.6+seed*.5) - i*26 - (t*14 % 26);
        cx.beginPath(); cx.arc(x+15+Math.sin(t+i)*6, yy, 12+i*4, 0, 7); cx.fill();
      }
      break; }
    case "ev": case "pod": { /* Windrad + Bäume/grüne Türme */
      cx.strokeStyle = "#E8EEF2"; cx.lineWidth = 5;
      const bx = x+20, by = GROUND-30, hh = 110+seed*40;
      cx.beginPath(); cx.moveTo(bx,by); cx.lineTo(bx,by-hh); cx.stroke();
      cx.save(); cx.translate(bx, by-hh); cx.rotate(reduceMotion? seed*6 : t*2+seed*6);
      for(let b=0;b<3;b++){ cx.rotate(Math.PI*2/3);
        cx.beginPath(); cx.moveTo(0,0); cx.lineTo(0,-40); cx.stroke(); }
      cx.restore();
      if(L.carType==="pod"){ /* begrünter Turm */
        cx.fillStyle = "#6FAF87"; cx.fillRect(x+70, GROUND-30-90-seed*70, 46, 90+seed*70+30);
        cx.fillStyle = "#3E8A5E";
        for(let i=0;i<4;i++) { cx.beginPath(); cx.arc(x+78+i*10, GROUND-34-90-seed*70, 8, 0, 7); cx.fill(); }
      } else {
        cx.fillStyle = "#4E8F4E";
        cx.beginPath(); cx.arc(x+100, GROUND-52, 20, 0, 7); cx.fill();
        cx.fillStyle = "#6B4A2E"; cx.fillRect(x+97, GROUND-40, 6, 12);
      }
      break; }
    case "solar": { /* Palme */
      cx.strokeStyle = "#8A6A3F"; cx.lineWidth = 8;
      cx.beginPath(); cx.moveTo(x, GROUND-24); cx.quadraticCurveTo(x+10, GROUND-70, x+26, GROUND-96); cx.stroke();
      cx.strokeStyle = "#2E9E62"; cx.lineWidth = 6;
      for(let i=0;i<5;i++){ const a = -2.6 + i*0.7;
        cx.beginPath(); cx.moveTo(x+26, GROUND-96);
        cx.quadraticCurveTo(x+26+Math.cos(a)*34, GROUND-96+Math.sin(a)*20, x+26+Math.cos(a)*52, GROUND-96+Math.sin(a)*40); cx.stroke(); }
      break; }
    case "future": { /* Bogen einer Schwebebahn */
      cx.strokeStyle = "rgba(255,255,255,.75)"; cx.lineWidth = 6;
      cx.beginPath(); cx.arc(x+80, GROUND+40, 150+seed*40, Math.PI*1.15, Math.PI*1.85); cx.stroke();
      cx.fillStyle = L.pal.mid;
      cx.fillRect(x, GROUND-30-100*(.5+seed), 40, 100*(.5+seed)+30);
      break; }
  }
  cx.restore();
}

function drawGroundAndRoad(L){
  /* Boden */
  cx.fillStyle = L.pal.ground;
  cx.beginPath(); cx.moveTo(0,H);
  for(let x=0;x<=W;x+=14) cx.lineTo(x, gy(game.worldX+x));
  cx.lineTo(W,H); cx.closePath(); cx.fill();
  /* Straße als Band auf dem Gelände */
  cx.strokeStyle = L.pal.road; cx.lineWidth = 30; cx.lineJoin="round";
  cx.beginPath();
  for(let x=-10;x<=W+10;x+=14){ const y=gy(game.worldX+x); x<0? cx.moveTo(x,y): cx.lineTo(x,y); }
  cx.stroke();
  /* Mittelstreifen */
  cx.strokeStyle = "rgba(255,255,255,.75)"; cx.lineWidth = 3;
  cx.setLineDash([26,30]); cx.lineDashOffset = -game.worldX;
  cx.beginPath();
  for(let x=-10;x<=W+10;x+=14){ const y=gy(game.worldX+x); x<0? cx.moveTo(x,y): cx.lineTo(x,y); }
  cx.stroke(); cx.setLineDash([]);
}

function drawZones(L, km){
  /* Baustellen */
  (L.slowZones||[]).forEach(z=>{
    const x1 = z[0]*L.pxKm - game.worldX, x2 = z[1]*L.pxKm - game.worldX;
    if(x2<-100||x1>W+100) return;
    for(const bx of [x1,x2]){
      const y = gy(game.worldX+bx);
      cx.fillStyle = "#E8862E";
      cx.fillRect(bx-4, y-46, 8, 32);
      for(let s=0;s<3;s++){ cx.fillStyle = s%2? "#fff":"#E8862E"; cx.fillRect(bx-26, y-46+s*8, 52, 7); }
    }
    cx.fillStyle = "rgba(232,134,46,.14)";
    cx.fillRect(Math.max(x1,0), 0, Math.min(x2,W)-Math.max(x1,0), H);
  });
  /* Tunnel / Schattenzonen */
  (L.shadows||[]).forEach(z=>{
    const x1 = z[0]*L.pxKm - game.worldX, x2 = z[1]*L.pxKm - game.worldX;
    if(x2<-100||x1>W+100) return;
    cx.fillStyle = "#3B4252";
    const left = Math.max(x1,-40), right = Math.min(x2,W+40);
    cx.beginPath();
    cx.moveTo(left, 0); cx.lineTo(right, 0);
    for(let x=right;x>=left;x-=14) cx.lineTo(x, gy(game.worldX+x)-58);
    cx.closePath(); cx.globalAlpha=.9; cx.fill(); cx.globalAlpha=1;
  });
}

function drawStations(L){
  (L.stations||[]).forEach(s=>{
    const x = s*L.pxKm - game.worldX;
    if(x<-80||x>W+80) return;
    const y = gy(game.worldX+x);
    cx.fillStyle = "#2E9E62";
    cx.fillRect(x-10, y-64, 20, 50);
    cx.fillStyle = "#fff"; cx.font = "900 18px system-ui"; cx.textAlign="center";
    cx.fillText(L.carType==="pod" ? "⛽" : "⚡", x, y-32);
    cx.textAlign = "left";
    cx.fillStyle = "rgba(46,158,98,.35)";
    cx.fillRect(x-40, y-6, 80, 10);
  });
}

function drawObstacles(L){
  (L.obstacles||[]).forEach((o,i)=>{
    const wx = o.km*L.pxKm + game.obstacleOff[i];
    const x = wx - game.worldX;
    if(x<-120||x>W+120) return;
    const y = gy(wx);
    cx.save(); cx.translate(x,y);
    /* Kutsche */
    cx.fillStyle = "#6B4A2E"; cx.fillRect(-38,-34,44,22);
    cx.fillStyle = "#2E2620";
    cx.beginPath(); cx.arc(-30,-8,10,0,7); cx.fill();
    cx.beginPath(); cx.arc(-2,-8,10,0,7); cx.fill();
    /* Pferd */
    cx.fillStyle = "#8A5A34";
    cx.fillRect(12,-30,34,16);
    cx.fillRect(38,-42,10,16);
    cx.fillRect(14,-16,5,14); cx.fillRect(38,-16,5,14);
    cx.restore();
  });
}

function drawCar(L){
  const carX = W*0.24, wx = game.worldX + carX;
  const y = gy(wx), ang = Math.atan(slopeAt(wx));
  cx.save(); cx.translate(carX, y-14); cx.rotate(ang);
  const wheel = (dx)=>{ cx.fillStyle="#22303C"; cx.beginPath(); cx.arc(dx,10,11,0,7); cx.fill();
                        cx.fillStyle="#B9C4CC"; cx.beginPath(); cx.arc(dx,10,4,0,7); cx.fill(); };
  switch(L.carType){
    case "oldtimer":
      cx.fillStyle="#3A322A"; cx.fillRect(-34,-14,52,18);
      cx.fillRect(-26,-38,28,26);
      cx.fillStyle="#C8B896"; cx.fillRect(-22,-34,20,12);
      wheel(-26); wheel(16);
      cx.fillStyle="#22303C"; cx.fillRect(20,-10,10,6); /* Auspuff */
      break;
    case "diesel":
      cx.fillStyle="#7A7F88"; cx.fillRect(-40,-20,80,22);
      cx.fillStyle="#5A5F68"; cx.fillRect(-24,-38,44,20);
      cx.fillStyle="#BFD5E2"; cx.fillRect(-20,-35,16,14); cx.fillRect(2,-35,14,14);
      wheel(-26); wheel(24);
      break;
    case "ev":
      cx.fillStyle="#2E9E9E";
      cx.beginPath(); cx.moveTo(-42,2); cx.quadraticCurveTo(-44,-18,-20,-22);
      cx.quadraticCurveTo(-6,-40,18,-36); cx.quadraticCurveTo(42,-30,44,-4);
      cx.lineTo(44,2); cx.closePath(); cx.fill();
      cx.fillStyle="#CFEFF2"; cx.fillRect(-8,-34,22,14);
      wheel(-26); wheel(26);
      cx.fillStyle="#F7C948"; cx.font="900 12px system-ui"; cx.fillText("⚡", -38,-4);
      break;
    case "solar":
      cx.fillStyle="#2E6FA8";
      cx.beginPath(); cx.moveTo(-46,2); cx.lineTo(-30,-20); cx.lineTo(30,-20); cx.lineTo(46,2); cx.closePath(); cx.fill();
      cx.fillStyle="#123A5C"; cx.fillRect(-28,-27,56,8); /* Solarpanel */
      cx.strokeStyle="#8FD4FF"; cx.lineWidth=1.5;
      for(let i=-24;i<=24;i+=8){ cx.beginPath(); cx.moveTo(i,-27); cx.lineTo(i,-19); cx.stroke(); }
      wheel(-26); wheel(26);
      break;
    case "pod":
      cx.fillStyle = chosenVariant==="air" ? "#7FCBB2" : "#EDF2F5";
      cx.beginPath(); cx.ellipse(0,-16,44,22,0,0,7); cx.fill();
      cx.fillStyle="#22303C"; cx.globalAlpha=.85;
      cx.beginPath(); cx.ellipse(8,-20,20,12,0,0,7); cx.fill(); cx.globalAlpha=1;
      cx.fillStyle = chosenVariant==="air" ? "#3FA66A" : "#4E9AD9";
      cx.fillRect(-36,-8,14,8); /* Tank-Markierung */
      wheel(-24); wheel(24);
      break;
    case "future":
      cx.fillStyle="#D9DEE8";
      cx.beginPath(); cx.moveTo(-48,2); cx.quadraticCurveTo(-40,-26,0,-30);
      cx.quadraticCurveTo(40,-26,48,2); cx.closePath(); cx.fill();
      cx.fillStyle="#123A5C"; cx.fillRect(-22,-32,44,7);
      cx.fillStyle="#7B5FD9"; cx.fillRect(40,-16,12,6); /* Finne */
      wheel(-28); wheel(28);
      break;
  }
  cx.restore();
}

function drawSmoke(){
  game.smoke.forEach(p=>{
    const x = p.wx - game.worldX;
    cx.globalAlpha = Math.max(p.life/p.max,0)*0.55;
    cx.fillStyle = "#6E6A62";
    cx.beginPath(); cx.arc(x, p.y, p.r, 0, 7); cx.fill();
  });
  cx.globalAlpha = 1;
}

/* ---------- Levelende ---------- */
function starsFor(L, pollution){
  if(pollution <= L.stars[0]) return 3;
  if(pollution <= L.stars[1]) return 2;
  return 1;
}
function finish(){
  const s = starsFor(game.L, game.pollution);
  progress.stars[currentIdx] = Math.max(progress.stars[currentIdx], s);
  progress.unlocked = Math.max(progress.unlocked, Math.min(currentIdx+2, LEVELS.length));
  screen = "result";
  showResult(s);
}
function fail(reason){
  screen = "fail";
  showFail(reason);
}

/* ---------- Overlay-Screens ---------- */
const overlay = document.getElementById("overlay");
function hideOverlay(){ overlay.style.display="none"; }
function show(html, transparent){
  overlay.innerHTML = html;
  overlay.className = transparent? "trans" : "";
  overlay.style.display = "flex";
  document.getElementById("hud").style.display = (screen==="play")? "flex":"none";
  if(screen!=="play") { touchWrap.style.display="none"; document.getElementById("hint").style.display="none"; }
}
overlay.addEventListener("click", e=>{
  const a = e.target.closest("[data-action]"); if(!a) return;
  const act = a.dataset.action, v = a.dataset.value;
  if(act==="select") showSelect();
  else if(act==="menu") showMenu();
  else if(act==="info"){ const i=+v; if(i < progress.unlocked) showInfo(i); }
  else if(act==="start") startLevel(+v, a.dataset.variant||null);
  else if(act==="retry") startLevel(currentIdx, chosenVariant);
  else if(act==="next"){ const n=currentIdx+1; n<LEVELS.length? showInfo(n) : showMenu(true); }
});

function showMenu(victory){
  screen="menu";
  show(`
  <div class="panel">
    <span class="eyebrow">Ein Spiel über Autos &amp; Nachhaltigkeit</span>
    <h1>WORLD <span>CAR</span></h1>
    <p class="lead">${victory
      ? "🏆 <b>Wahnsinn!</b> Du hast alle sechs Epochen gemeistert – und gezeigt, dass man weit kommen kann, ohne die Umwelt zu verschmutzen."
      : "Fahr durch mehr als 150 Jahre Autogeschichte – vom qualmenden Benzin-Urwagen bis zum Solarauto der Zukunft. Erreiche in jedem Level das Ziel, bevor die Energie ausgeht, und halte die <b>Umwelt-Leiste</b> so leer wie möglich."}</p>
    <button class="btn" data-action="select">▶ ${victory? "Nochmal spielen":"Los geht's"}</button>
    <p class="keys">Steuerung: <kbd>→</kbd>/<kbd>D</kbd> Gas &nbsp; <kbd>←</kbd>/<kbd>A</kbd> Bremse &nbsp; (auf Handy &amp; Tablet: Bildschirm-Buttons)</p>
  </div>`);
}

function showSelect(){
  screen="select";
  const cards = LEVELS.map((L,i)=>{
    const open = i < progress.unlocked;
    const st = progress.stars[i];
    return `<button class="card ${open?"":"locked"}" style="background:${L.cardCol}"
              data-action="info" data-value="${i}" ${open?"":"disabled"}>
      <div><div class="year">${L.jahr}</div><div class="place">${L.ort}</div></div>
      <span class="drive">${L.antrieb} · ${L.dist} km</span>
      ${st? `<span class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</span>`:""}
    </button>`;
  }).join("");
  show(`
  <div class="panel">
    <span class="eyebrow">Die Zeitstraße</span>
    <h2>Wähle dein Level</h2>
    <p class="lead">Jede Epoche hat ihren eigenen Antrieb – und ihr eigenes Problem.</p>
    <div class="grid">${cards}</div>
    <button class="btn alt" data-action="menu" style="margin-top:18px">Zurück</button>
  </div>`);
}

function showInfo(i){
  screen="info"; currentIdx=i;
  const L = LEVELS[i];
  let buttons;
  if(L.choice){
    buttons = Object.entries(L.variants).map(([k,v])=>
      `<button class="btn" data-action="start" data-value="${i}" data-variant="${k}">${v.label} fahren</button>`).join("");
  } else {
    buttons = `<button class="btn" data-action="start" data-value="${i}">🏁 Los geht's</button>`;
  }
  show(`
  <div class="panel">
    <span class="eyebrow">Level ${i+1} · ${L.jahr}</span>
    <h2>${L.ort} – ${L.antrieb}</h2>
    <div class="infoBox">${L.info}<br><br>💡 <b>Tipp:</b> ${L.tipp}</div>
    <p class="lead">Ziel: <b>${L.dist} km</b> schaffen, bevor die Energie leer ist – möglichst sauber!</p>
    ${buttons}
    <button class="btn alt" data-action="select">Level-Auswahl</button>
  </div>`);
}

function showResult(s){
  const L = LEVELS[currentIdx];
  const last = currentIdx === LEVELS.length-1;
  const clean = Math.round(game.pollution);
  let comment;
  if(s===3) comment = "Fantastisch sauber gefahren! 🌱";
  else if(s===2) comment = "Gut gemacht – da geht noch ein bisschen weniger Dreck.";
  else comment = "Geschafft! Aber die Luft hat ganz schön gelitten …";
  show(`
  <div class="panel">
    <span class="eyebrow">Level ${currentIdx+1} geschafft</span>
    <h2>${L.ort} ${L.jahr}</h2>
    <div class="starsBig">${"★".repeat(s)}<span style="opacity:.25">${"★".repeat(3-s)}</span></div>
    <p class="lead">Umwelt-Leiste am Ziel: <b>${clean} %</b><br>${comment}</p>
    ${last && s>=2 ? `<p class="lead">🏅 <b>Netto-Null-Challenge bestanden!</b></p>`:""}
    <button class="btn" data-action="${last? "next":"next"}">${last? "Zum Abschluss":"Weiter ➜"}</button>
    <button class="btn sun" data-action="retry">Nochmal (bessere Wertung)</button>
    <button class="btn alt" data-action="select">Level-Auswahl</button>
  </div>`);
}

function showFail(reason){
  const msg = reason==="energie"
    ? "🔋 <b>Energie leer!</b> Ohne Treibstoff oder Strom geht nichts mehr. Nutze Stationen und Sonne – oder fahre sparsamer."
    : "🌍 <b>Die Luft ist zu verschmutzt!</b> Die Umwelt-Leiste ist voll. Geh öfter vom Gas – Rollen ist gratis und sauber.";
  show(`
  <div class="panel">
    <span class="eyebrow">Level ${currentIdx+1} · verloren</span>
    <h2>Ohje!</h2>
    <p class="lead">${msg}</p>
    <button class="btn warn" data-action="retry">↻ Neustart</button>
    <button class="btn alt" data-action="select">Zurück zur Level-Auswahl</button>
  </div>`, true);
}

/* ---------- Hauptschleife ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000, 0.05);
  last = now;
  if(screen==="play" && game){ update(dt); if(screen==="play") draw(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
showMenu();
</script>
</body>
</html>
